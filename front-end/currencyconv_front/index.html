<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, initial-scale=1.0">
  <title>Currency Converter Client</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      padding: 50px;
    }

    .container {
      background: white;
      padding: 38px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 350px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }
    label{
        display:block;
        margin-bottom:5px;
        font-weight:bold;
        color:#555;
    }

    input, select, button {
      width: 100%;
      padding: 18px;
      margin-top: 5px;
      box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;  
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px;
      font-weight:bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0056b3;
    }

    .output-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #e9ecef;
      border-radius: 4px;
      font-family: monospace;
      min-height:50px;
      white-space: pre-wrap;
      color:#333;
    }
  </style>
  <script src ="main.js" defer></script>
</head>
<body>
  <div class="container">
    <h2>USD / LKR Converter</h2>

    <div class="form-group">
      <label for="amountValue">Amount</label>
      <input type="number" id="amountValue" placeholder="E.g. 188" required>
    </div>

    <div class="form-group">
      <label for="currencyUnit">Select Currency:</label>
      <select id="currencyUnit">
        <option value="USD">USD</option>
        <option value="LKR">LKR</option>
      </select>
    </div>

    <button onclick="convertCurrency()">Convert</button>
    <button class="exchangeRate" onclick="exchangeRate()">Exchange Rate</button>
    <button onclick="goToHistory()" class="btn btn-info">View History</button>
    <div class="output-box" id="outputBox">Results will appear here...</div>
  </div>
</body>
</html>
